<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#44ff88" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#44ff88" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#44ff88" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="1.8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#0c1a12"/>
  <g opacity="0.5">
    <rect x="60" y="80" width="520" height="22" rx="6" fill="#1c3326"/>
    <rect x="60" y="124" width="420" height="16" rx="5" fill="#16271d"/>
    <rect x="60" y="156" width="460" height="16" rx="5" fill="#16271d"/>
    <rect x="60" y="200" width="240" height="80" rx="8" fill="#16271d"/>
    <rect x="320" y="200" width="260" height="80" rx="8" fill="#16271d"/>
  </g>
  <rect width="640" height="360" fill="url(#shine)"/>
  <text x="320" y="320" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#44ff88" opacity="0.7">demo coming soon</text>
</svg>
